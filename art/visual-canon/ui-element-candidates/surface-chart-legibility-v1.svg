  <text x="52" y="501" fill="#e8e5dc" font-family="Arial, sans-serif" font-size="19">A · Keep map dark, clarify terrain</text>
  <text x="52" y="532" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="15">Small contrast lift; visible shore and broad relief bands.</text>
  <text x="52" y="557" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="15">Keep contours fine and secondary to real contact marks.</text>
  <text x="52" y="582" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="15">Live colors still derive from sampled height and water.</text>
  <text x="52" y="627" fill="#8fc7b1" font-family="Arial, sans-serif" font-size="13">BASELINE OBSERVED IN CAPTURE</text>
  <text x="52" y="651" fill="#b7beb7" font-family="Arial, sans-serif" font-size="13">Current chart looks nearly blank at HUD size.</text>

