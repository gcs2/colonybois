  <text x="542" y="501" fill="#e8e5dc" font-family="Arial, sans-serif" font-size="19">A · Preserve restraint</text>
  <text x="542" y="532" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="15">Clearer coast, readable land bands, fine contours.</text>
  <text x="542" y="557" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="15">Runtime contacts keep their sampled map anchors.</text>
  <text x="542" y="582" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="15">Only selection gets the warm target emphasis.</text>
  <text x="542" y="627" fill="#e1cc85" font-family="Arial, sans-serif" font-size="13">FIRST IMPLEMENTATION CANDIDATE</text>
  <text x="542" y="651" fill="#b7beb7" font-family="Arial, sans-serif" font-size="13">No extra geography, labels, or fictional contacts.</text>

