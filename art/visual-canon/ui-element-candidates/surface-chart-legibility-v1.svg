  <rect width="1500" height="900" fill="#1b2427"/>
  <text x="48" y="55" fill="#e8e5dc" font-family="Arial, sans-serif" font-size="28" letter-spacing="1.4">LOCAL SURFACE CHART · HUD LEGIBILITY STUDY</text>
  <text x="48" y="87" fill="#b8c0ba" font-family="Arial, sans-serif" font-size="16">Schematic style options; compare to the exact live 1920×1080 chart crop. Geography and contacts remain runtime data.</text>
  <text x="48" y="119" fill="#c8c9bd" font-family="Arial, sans-serif" font-size="14">Hold the 250×215 housing, 125 m window, 50 m scale, north-up orientation, contact positions, pointer actions and surface-only scope fixed.</text>

  <!-- CURRENT STYLE -->
  <rect x="32" y="140" width="456" height="550" rx="2" fill="#30383a" stroke="#89918a" stroke-width="1"/>
  <text x="52" y="160" fill="#dfded4" font-family="Arial, sans-serif" font-size="16" letter-spacing="1">BASELINE STYLE · SCHEMATIC</text>
