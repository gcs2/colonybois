  <text x="1032" y="501" fill="#e8e5dc" font-family="Arial, sans-serif" font-size="19">B · Increase separation</text>
  <text x="1032" y="532" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="15">Stronger coast, terrain bands and contact symbols.</text>
  <text x="1032" y="557" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="15">Runtime contacts keep their sampled map anchors.</text>
  <text x="1032" y="582" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="15">Risk: map may compete with other HUD elements.</text>
  <text x="1032" y="627" fill="#8fc7b1" font-family="Arial, sans-serif" font-size="13">UPPER-BOUND COMPARISON</text>
  <text x="1032" y="651" fill="#b7beb7" font-family="Arial, sans-serif" font-size="13">No blur, camera shift, or raster geography.</text>

  <!-- Selection treatment strip -->
