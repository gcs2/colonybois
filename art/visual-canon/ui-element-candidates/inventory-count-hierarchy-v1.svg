    <ellipse cx="122" cy="64" rx="44" ry="12" fill="#c5fbfa" stroke="#477d82" stroke-width="3"/>
    <path d="M94 77v69" stroke="#c0f5f0" stroke-width="5" opacity=".48"/>
    <path d="M97 50h50l-5-15h-40Z" fill="#c7bba1" stroke="#766d5e" stroke-width="3"/>
    <text x="18" y="213" fill="#77817e" font-family="Arial, sans-serif" font-size="17">4</text>
    <text x="164" y="213" fill="#1a2224" font-family="Arial, sans-serif" font-size="20" stroke="#1a2224" stroke-width="3.6" paint-order="stroke fill">× 1</text>
    <text x="164" y="213" fill="#fff2ce" font-family="Arial, sans-serif" font-size="16">× 1</text>
  </g>
  <text x="866" y="534" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="14">Count is more prominent than the hint.</text>
  <text x="866" y="560" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="14">Check it does not compete with the icon.</text>
  <text x="866" y="615" fill="#b7beb7" font-family="Arial, sans-serif" font-size="13">UPPER-BOUND READABILITY TEST</text>

  <path d="M42 688h1176" stroke="#4a5757" stroke-width="1"/>
  <text x="42" y="708" fill="#b8c0ba" font-family="Arial, sans-serif" font-size="13">Count text remains state-driven. No icon, slot, shortcut, selected-cell mark, or five-card tab treatment changes.</text>
</svg>
