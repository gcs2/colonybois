    <path d="M97 50h50l-5-15h-40Z" fill="#c7bba1" stroke="#766d5e" stroke-width="3"/>
    <text x="18" y="213" fill="#77817e" font-family="Arial, sans-serif" font-size="17">4</text>
    <text x="173" y="213" fill="#1a2224" font-family="Arial, sans-serif" font-size="17" stroke="#1a2224" stroke-width="3.2" paint-order="stroke fill">× 1</text>
    <text x="173" y="213" fill="#fff2ce" font-family="Arial, sans-serif" font-size="14">× 1</text>
  </g>
  <text x="460" y="534" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="14">Keep the current number size and anchor.</text>
  <text x="460" y="560" fill="#c5cbc4" font-family="Arial, sans-serif" font-size="14">A dark outline separates it from the icon.</text>
  <text x="460" y="615" fill="#e1cc85" font-family="Arial, sans-serif" font-size="13">LOWEST-CHANGE CANDIDATE</text>

  <!-- OPTION B -->
  <rect x="844" y="142" width="382" height="520" fill="#30383a" stroke="#89918a" stroke-width="1"/>
  <text x="866" y="177" fill="#dfded4" font-family="Arial, sans-serif" font-size="17" letter-spacing="1">OPTION B · 16 PX OUTLINE</text>
  <text x="866" y="202" fill="#b9c0b6" font-family="Arial, sans-serif" font-size="13">Slightly larger, same anchor.</text>
  <g transform="translate(899 251)">
    <path d="M0 10 18 0h208l18 10v216l-18 10H18L0 226Z" fill="url(#paper)"/>
    <path d="M8 17 23 8h196l17 9v201l-17 9H23L8 218Z" fill="url(#cell)" stroke="#39494b" stroke-width="2"/>
